<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkForge</title>
  <meta name="description" content="A simple URL shortener with stats and fast redirects." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="page-frame">
    <header class="topbar">
      <h1>LinkForge</h1>
      <p class="eyebrow topbar-label">Link management</p>
    </header>

    <main class="layout">
      <section class="hero card">
        <div class="hero-copy">
          <h2>Short links and stats in one place.</h2>
          <p class="hero-text">
            Create a link, set an expiry, and see the clicks.
          </p>
        </div>
      </section>

      <section class="workspace">
        <div class="card panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">Create link</p>
              <h3>Create a short link</h3>
            </div>
          </div>

          <form id="shorten-form" class="form-grid">
            <label>
              <span>Long URL</span>
              <input id="original-url" name="url" type="url" placeholder="https://example.com/page" required />
            </label>

            <div class="single-up">
              <label>
                <span>Expiry minutes</span>
                <input id="ttl-minutes" name="ttlMinutes" type="number" min="1" step="1" placeholder="60" />
              </label>
            </div>

            <div class="form-actions">
              <button type="submit" class="primary-button">Create link</button>
              <button type="button" class="secondary-button" id="prefill-demo">Use demo</button>
            </div>
          </form>

          <div class="feedback" id="create-feedback" aria-live="polite"></div>

          <div class="result-card hidden" id="result-card">
            <div class="result-head">
              <div>
                <p class="eyebrow">Latest link</p>
                <h4 id="short-code-label"></h4>
              </div>
              <span class="result-status">Ready</span>
            </div>
            <div class="result-url" id="short-url"></div>
            <div class="result-actions">
              <button type="button" class="secondary-button" id="copy-link">Copy link</button>
              <a class="primary-button link-button" id="open-link" href="#" target="_blank" rel="noreferrer">Open</a>
            </div>
            <div class="result-meta">
              <span id="expiry-label"></span>
              <button type="button" class="link-button text-link" id="analytics-link">View stats</button>
            </div>
          </div>
        </div>

        <aside class="sidebar">
          <div class="card panel">
            <div class="section-head">
              <div>
                <p class="eyebrow">Stats</p>
                <h3>Check a link</h3>
              </div>
            </div>

            <form id="analytics-form" class="analytics-form">
              <label>
                <span>Short code</span>
                <input id="analytics-code" type="text" placeholder="your-code" required />
              </label>
              <button type="submit" class="primary-button">Show stats</button>
            </form>

            <div class="analytics-summary" id="analytics-summary">
              <p class="empty-state">Enter a code to see clicks and visits.</p>
            </div>
          </div>
        </aside>
      </section>
    </main>
  </div>
</body>
</html>
